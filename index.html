<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sarah &amp; Hatim - Wedding Invitation</title><meta name="theme-color" content="#0e1f16">
<meta property="og:title" content="Sarah &amp; Hatim - Wedding Invitation"><meta property="og:description" content="Customized Invitation Card - For our valuable guest"><meta property="og:image" content="https://burhanuddinraja008-alt.github.io/sarah-hatim-green-card/og.jpg">
<link rel="preload" as="image" href="front.jpg"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:#0e1f16;overscroll-behavior:none}
body{font-family:Georgia,serif;color:#f1d98a;-webkit-user-select:none;user-select:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#mute{position:fixed;bottom:14px;right:14px;z-index:50;width:38px;height:38px;border-radius:50%;border:1px solid rgba(201,162,75,.8);background:rgba(15,32,22,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#f1d98a;font-size:18px;padding:0;cursor:pointer}
#mute.off{opacity:.5;text-decoration:line-through}
.amb{position:fixed;inset:-10%;z-index:0;background:linear-gradient(rgba(22,74,44,.72),rgba(8,28,17,.82)),url(front.jpg) center/cover;filter:blur(40px) saturate(1.4);transform:scale(1.2)}
.vig{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(5,12,8,.55) 100%)}
.cap{position:fixed;left:0;right:0;bottom:0;z-index:30;text-align:center;padding:0 54px 16px;pointer-events:none;opacity:0;transition:opacity 1.2s ease;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.cap.show{opacity:1}
.cap b{display:block;font-weight:normal;font-style:italic;font-size:clamp(19px,5.6vw,24px);color:#f1d98a;margin-bottom:6px}
.cap span{display:block;font-size:clamp(12.5px,3.6vw,14.5px);line-height:1.4;color:#eadfb8;letter-spacing:.03em}
:root{--ch:calc(100dvh - 110px);--cw:min(92vw,calc((100dvh - 110px) * .6664))}
.cap span i{font-style:normal;white-space:nowrap;display:inline-block}
</style>
<style>
body{height:100dvh;overflow:hidden}
.stage{position:fixed;left:50%;top:calc((100dvh - 110px)/2 + 14px);width:var(--cw);aspect-ratio:875/1313;margin-left:calc(var(--cw)/-2);margin-top:calc(var(--cw)*1.5/-2);z-index:2;perspective:1500px;cursor:pointer;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.in{position:absolute;inset:0;border-radius:6px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1.5px rgba(201,162,75,.65);transform:scale(.94);transition:transform 2.4s cubic-bezier(.2,.7,.2,1) .2s}
.in img{width:100%;height:100%;display:block}
.open .in{transform:scale(1)}
.glow{position:absolute;inset:-18%;background:radial-gradient(ellipse at 50% 50%,rgba(255,226,140,.0),rgba(255,226,140,0) 60%);transition:background 1.6s}
.open .glow{background:radial-gradient(ellipse at 50% 50%,rgba(255,226,140,.5),rgba(255,226,140,0) 62%)}
.door{position:absolute;top:0;width:50%;height:100%;overflow:hidden;transition:transform 2.3s cubic-bezier(.65,0,.2,1),filter 2.3s;backface-visibility:hidden;box-shadow:0 0 0 1.5px rgba(201,162,75,.65)}
.door img{position:absolute;top:0;height:100%;width:200%;display:block;max-width:none}
.door.l{left:0;transform-origin:0 50%;border-radius:6px 0 0 6px}.door.l img{left:0}
.door.r{right:0;transform-origin:100% 50%;border-radius:0 6px 6px 0}.door.r img{right:0}
.open .door.l{transform:rotateY(-112deg);filter:brightness(.55)}
.open .door.r{transform:rotateY(112deg);filter:brightness(.55)}
.seam{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(transparent,#f1d98a,transparent);box-shadow:0 0 14px 3px rgba(241,217,138,.8);z-index:3;animation:pl 2s infinite;transition:opacity .6s}
.open .seam{opacity:0;animation:none}
@keyframes pl{50%{opacity:.35}}
.sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,240,190,.4) 50%,transparent 65%);background-size:250% 100%;mix-blend-mode:soft-light;z-index:2;transition:opacity .5s}
.open .sheen{opacity:0}
</style></head><body>
<div class="amb"></div><div class="vig"></div><canvas id="fx"></canvas>
<audio id="bgm" src="madeh.mp3" loop preload="none"></audio><button id="mute" style="display:none" aria-label="Music">&#9835;</button>
<div class="stage" id="st"><div class="glow"></div>
 <div class="in"><img src="inner.jpg" alt="Wedding details - Sarah weds Hatim"></div>
 <div class="door l"><img src="front.jpg" alt="Wedding Invitation - Sarah and Hatim"></div>
 <div class="door r"><img src="front.jpg" alt=""></div>
 <div class="seam"></div><div class="sheen" id="sheen"></div>
</div>
<div class="cap" id="cap"><b>Awaiting to welcome you</b><span><i>Saturday, 30 January 2027,</i> <i>Masakin-E-Saifiyah, Bijalpur, Indore</i></span></div>
<script>/* gold dust + bokeh, depth layers; px,py = parallax offset -1..1 set by page */
var FX={px:0,py:0,boost:0};
(function(){
var c=document.getElementById('fx'),x=c.getContext('2d'),W,H,D=Math.min(devicePixelRatio||1,2),P=[];
function rs(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}rs();addEventListener('resize',rs);
for(var i=0;i<46;i++){var z=Math.random();P.push({x:Math.random(),y:Math.random(),z:z,r:(z<.25?9+Math.random()*14:1+Math.random()*2.2),v:.00008+z*.00028,p:Math.random()*6,bk:z<.25})}
function f(t){x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
for(var i=0;i<P.length;i++){var q=P[i];q.y-=q.v*(1+FX.boost*6);if(q.y<-.05){q.y=1.05;q.x=Math.random()}
var X=(q.x+Math.sin(t/3000+q.p)*.02)*W+FX.px*q.z*40,Y=q.y*H+FX.py*q.z*40,a=(.25+.5*Math.abs(Math.sin(t/900+q.p)));
if(q.bk){var g=x.createRadialGradient(X,Y,0,X,Y,q.r);g.addColorStop(0,'rgba(241,217,138,'+a*.22+')');g.addColorStop(1,'rgba(241,217,138,0)');x.fillStyle=g;x.beginPath();x.arc(X,Y,q.r,0,6.3);x.fill()}
else{x.fillStyle='rgba(255,226,140,'+a*.8+')';x.beginPath();x.arc(X,Y,q.r,0,6.3);x.fill()}}
requestAnimationFrame(f)}requestAnimationFrame(f);
})();
var AUD={a:document.getElementById('bgm'),m:document.getElementById('mute'),on:false,
start:function(){if(this.on)return;this.on=true;try{this.a.volume=.85;this.a.play().catch(function(){})}catch(e){}this.m.style.display='block'}};
AUD.m.addEventListener('click',function(e){e.stopPropagation();var m=!AUD.a.muted;AUD.a.muted=m;AUD.m.classList.toggle('off',m);if(!m&&AUD.a.paused)AUD.a.play().catch(function(){})});
</script>
<script>
var st=document.getElementById('st'),cap=document.getElementById('cap'),sh=document.getElementById('sheen'),isOpen=false,busy=false;
st.addEventListener('click',function(){AUD.start();if(busy)return;busy=true;isOpen=!isOpen;st.classList.toggle('open',isOpen);FX.boost=isOpen?1:0;
 setTimeout(function(){FX.boost=0;busy=false},2600);
 if(isOpen)setTimeout(function(){cap.classList.add('show')},1800);else cap.classList.remove('show')});
var tx=0,ty=0;
addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5);ty=(e.clientY/innerHeight-.5);FX.px=-tx*2;FX.py=-ty*2});
(function f(t){sh.style.backgroundPosition=(120-((t/16)%300))+'% 0';requestAnimationFrame(f)})(0);
</script></body></html>
